<style>
#kur{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.22);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#kur .ic{max-width:520px;margin:0 auto}
#kur h2{font-size:18px;margin:0 0 4px}
#kur p{margin:0 0 10px;color:var(--ink2);font-size:14.5px}
#kur ol{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
#kur li{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px}
#kur li b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--surface);display:flex;align-items:center;justify-content:center;font-size:14px}
#kur svg{width:22px;height:22px;vertical-align:-5px;display:inline;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#kur .dg{display:flex;gap:8px}
#kur .dg button{flex:1;min-height:44px;font-size:15px}
#kur .ana{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:600}
</style>
<script>
// Kurulum kartı: sayfa uygulama olarak açılmamışsa, cihaza göre ne yapılacağını bir kez gösterir.
(function () {
  var ayakta = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  if (ayakta || window.top !== window) return;
  var gorduk = false; try { gorduk = localStorage.getItem('kurGoruldu') === '1'; } catch (e) {}
  if (gorduk) return;
  var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|Chrome|Chromium|Edg\//.test(ua), mac = /Macintosh/.test(ua) && !ios;
  var PAYLAS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  var ARTI = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
  var bekleyen = null, kart = null;
  function kapat() { if (kart) kart.remove(); try { localStorage.setItem('kurGoruldu', '1'); } catch (e) {} }
  function goster(baslik, govde, dugme) {
    kart = document.createElement('div'); kart.id = 'kur'; kart.setAttribute('role', 'dialog'); kart.setAttribute('aria-label', baslik);
    kart.innerHTML = '<div class="ic"><h2>' + baslik + '</h2>' + govde + '<div class="dg">' + (dugme ? '<button class="btn ana" id="kur-y">' + dugme + '</button>' : '') + '<button class="btn" id="kur-k">' + (dugme ? 'Şimdi değil' : 'Anladım') + '</button></div></div>';
    document.body.appendChild(kart); document.getElementById('kur-k').onclick = kapat;
    var y = document.getElementById('kur-y'); if (y) y.onclick = function () { if (bekleyen) { bekleyen.prompt(); bekleyen = null; } kapat(); };
  }
  if (location.protocol === 'file:') {
    if (ios) goster('Ana ekrana eklemek için', '<p>Bu sayfa şu an bir dosyadan açık. iPhone ve iPad yalnız bir web adresinden açılan sayfaları ana ekrana ekler. Size gönderilen bağlantıyı Safari\'de açın.</p>');
    return;
  }
  if (ios && safari) goster('Tedebbür\'ü ana ekrana ekleyin', '<p>İki dokunuş; sonra uygulama gibi, internetsiz de açılır.</p><ol><li><b>1</b><span>Ekranın altındaki ' + PAYLAS + ' <strong>Paylaş</strong> düğmesine dokunun.</span></li><li><b>2</b><span>Listeyi kaydırıp ' + ARTI + ' <strong>Ana Ekrana Ekle</strong>\'yi seçin, sonra <strong>Ekle</strong>\'ye dokunun.</span></li></ol>');
  else if (ios) goster('Safari\'de açın', '<p>Ana ekrana eklemek için bu sayfayı Safari\'de açın: adresi kopyalayıp Safari\'ye yapıştırın.</p>');
  else if (mac && safari) goster('Tedebbür\'ü Dock\'a ekleyin', '<ol><li><b>1</b><span>Üstteki menüden <strong>Dosya</strong>\'ya tıklayın.</span></li><li><b>2</b><span><strong>Dock\'a Ekle…</strong> seçeneğini seçin, sonra <strong>Ekle</strong>\'ye tıklayın.</span></li></ol>');
  else addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); bekleyen = e; goster('Tedebbür\'ü yükleyin', '<p>Tek dokunuşla uygulama olarak kurulur.</p>', 'Yükle'); });
})();
</script>
