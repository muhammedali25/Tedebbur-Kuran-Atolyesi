name: Mektubat APK

on:
  push:
    branches: [main]
    paths: ['mektubat/android/**', 'mektubat/site/**', 'mektubat/fonts/**', 'mektubat/build/**', '.github/workflows/mektubat-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mektubat-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: İmza anahtarı (varsa)
        env:
          ANAHTAR_B64: ${{ secrets.MEKTUBAT_ANAHTAR_B64 }}
        run: |
          if [ -n "$ANAHTAR_B64" ]; then
            echo "$ANAHTAR_B64" | base64 -d > "$RUNNER_TEMP/mektubat.jks"
            echo "ANAHTAR_DEPOSU=$RUNNER_TEMP/mektubat.jks" >> "$GITHUB_ENV"
          fi
      - name: APK derle
        env:
          ANAHTAR_PAROLA: ${{ secrets.MEKTUBAT_ANAHTAR_PAROLA }}
        run: |
          export SURUM_KODU=$(( ${{ github.run_number }} + 5 ))
          export SURUM_ADI=1.$SURUM_KODU
          [ -n "$ANAHTAR_PAROLA" ] || unset ANAHTAR_PAROLA
          chmod +x mektubat/build/apk.sh
          mektubat/build/apk.sh
          cp mektubat/dist/Mektubat.apk Mektubat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mektubat-apk
          path: Mektubat.apk
      - name: Sürüm olarak yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mektubat-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create mektubat-apk Mektubat.apk --latest=false --target "$GITHUB_SHA" \
            --title "Mektûbât Android (derleme ${{ github.run_number }})" \
            --notes "Android telefon ve tabletler için kurulum dosyası. İndirip açın; ilk kurulumda Android 'bilinmeyen kaynak' izni ister. Metinler uygulamanın içindedir, internetsiz çalışır."
